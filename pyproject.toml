[project]
name = "vestium"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.4",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = true